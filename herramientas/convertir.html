<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convertir peleador</title>
  <style>
    :root { --gold: #f5c542; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 14px system-ui, sans-serif; overflow: hidden; }
    #view { position: fixed; inset: 0; }
    #panel { position: fixed; top: 12px; left: 12px; width: 330px; max-height: calc(100% - 24px); overflow-y: auto; background: rgba(10, 8, 6, .9); border: 1px solid #333; padding: 14px; }
    h1 { margin: 0 0 10px; font-size: 20px; color: var(--gold); letter-spacing: 1px; }
    label { display: block; margin: 8px 0 3px; color: #aaa; font-size: 12px; }
    input, select { width: 100%; padding: 6px; background: #1c1c1c; color: #fff; border: 1px solid #444; }
    button { margin-top: 10px; width: 100%; padding: 9px; background: var(--gold); color: #111; border: 0; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .4; cursor: default; }
    #log { margin-top: 10px; white-space: pre-wrap; font: 12px ui-monospace, monospace; color: #9c9; }
    .row { display: flex; gap: 8px; } .row > div { flex: 1; }
    #anims { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    #anims button { width: auto; margin: 0; padding: 4px 8px; background: #333; color: #ddd; font-weight: 400; }
    code { color: var(--gold); }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "meshoptimizer": "https://cdn.jsdelivr.net/npm/meshoptimizer@0.21.0/+esm"
    }
  }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="panel">
    <h1>CONVERTIR PELEADOR</h1>
    <p>Sube el modelo de Meshy o Tripo (<code>.fbx</code> o <code>.glb</code>, con sus texturas si vienen aparte). Se reduce, se le pone esqueleto automático y se guarda en el juego.</p>
    <label>Archivos (modelo + texturas)</label>
    <input type="file" id="files" multiple accept=".fbx,.glb,.gltf,.png,.jpg,.jpeg,.bin">
    <div class="row">
      <div><label>id (carpeta)</label><input id="fid" placeholder="diego"></div>
      <div><label>Triángulos</label><input id="tris" type="number" value="45000" step="5000"></div>
    </div>
    <div class="row">
      <div><label>Textura color</label><select id="texsize"><option>1024</option><option selected>2048</option><option>4096</option></select></div>
      <div><label>Girar (grados)</label><select id="rot"><option>0</option><option>90</option><option>-90</option><option>180</option></select></div>
    </div>
    <button id="save" disabled>GUARDAR EN EL JUEGO</button>
    <div id="anims"></div>
    <div id="log"></div>
  </div>
  <script type="module" src="convertir.js"></script>
</body>
</html>
